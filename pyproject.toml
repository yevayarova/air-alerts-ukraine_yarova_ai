[project]
name = "air-alerts-ukraine-yarova-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4",
    "geopandas>=1.1.3",
    "networkx>=3.6.1",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "polars>=1.42.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.15.19",
    "ruptures>=1.1.10",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "setuptools>=82.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
